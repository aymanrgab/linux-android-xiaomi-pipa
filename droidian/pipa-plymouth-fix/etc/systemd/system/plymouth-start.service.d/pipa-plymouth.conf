[Service]
# pipa: use udev to open /dev/dri/card* with the DRM renderer. The stock
# plymouth.ignore-udev cmdline forces AUTO→minui, which drmModeSetCrtc's
# during continuous splash and corrupts this dual-DSI panel.
ExecStart=
ExecStart=/usr/sbin/plymouthd --mode=boot --pid-file=/run/plymouth/pid --attach-to-session --ignore-serial-consoles
